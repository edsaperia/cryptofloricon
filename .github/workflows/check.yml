# Runs the tests and the build on every push and pull request, except pushes
# to main: there pages.yml runs the same tests and build before it deploys,
# so the deploy never waits behind this check. A check only: it deploys nothing.
name: Check

on:
  push:
    branches-ignore: [main]
  pull_request:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests
        run: node --test
      - name: Build
        run: node build.js
