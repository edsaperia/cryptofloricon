# Netlify builds this repository (a Deploy Preview for every pull request push).
# The site is built from data/lexicon.json by build.js, Node's standard library
# only, into site/. Netlify serves site/404.html for any missing address on
# its own, so no redirect rule is needed for the 404 page.
[build]
  command = "node build.js"
  publish = "site"

[build.environment]
  NODE_VERSION = "22"
